<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(anton.woff2)}
@font-face{font-family:Inter;font-weight:400;src:url(inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(inter-latin-800-normal.woff2)}
@font-face{font-family:Inter;font-weight:900;src:url(inter-latin-900-normal.woff2)}
@font-face{font-family:Fraktur;src:url(unifrakturmaguntia-latin-400-normal.woff2)}
@font-face{font-family:Playfair;font-weight:700;src:url(playfair-display-latin-700-normal.woff2)}
@font-face{font-family:Playfair;font-weight:900;src:url(playfair-display-latin-900-normal.woff2)}
@font-face{font-family:OldStd;src:url(old-standard-tt-latin-400-normal.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="timing.js"></script>
<script>
const cv=document.getElementById('c'),X=cv.getContext('2d');
const W=1920,H=1080;
const PAPER='#F3EFE6',INK='#1D1D22',RED='#D7263D',BLUE='#1F5BB5',GOLD='#F2B632',NAVY='#1B2340',GREEN='#2E9E5B',GREY='#9A968C',SKIN='#1D1D22',HAIR='#F2C14E';
const SC_TOP=0, SC_H=860; // scene area above subtitles

// ---------- utils ----------
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,u)=>a+(b-a)*u;
const eo=u=>1-Math.pow(1-clamp(u),3);
const eio=u=>{u=clamp(u);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2};
const back=u=>{u=clamp(u);const c=1.9;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2)};
const ap=(t,s,d=.5)=>clamp((t-s)/d);           // appear progress
function save(f){X.save();f();X.restore();}
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r);}
function line(pts,c=INK,w=8){X.strokeStyle=c;X.lineWidth=w;X.lineCap='round';X.lineJoin='round';X.beginPath();pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.stroke();}
function circ(x,y,r,f,s,w=6){X.beginPath();X.arc(x,y,r,0,7);if(f){X.fillStyle=f;X.fill();}if(s){X.strokeStyle=s;X.lineWidth=w;X.stroke();}}
function txt(s,x,y,o={}){X.font=(o.w||900)+' '+(o.size||60)+'px '+(o.font||'Inter');X.fillStyle=o.color||INK;X.textAlign=o.align||'center';X.textBaseline=o.base||'middle';
  if(o.stroke){X.lineWidth=o.stroke;X.strokeStyle=o.sc||PAPER;X.lineJoin='round';X.strokeText(s,x,y);}X.fillText(s,x,y);}
// pop-in transform around point
function pop(x,y,u,f,rot=0){if(u<=0)return;save(()=>{const k=back(u);X.translate(x,y);X.rotate(rot*(1-eo(u)));X.scale(k,k);X.globalAlpha*=clamp(u*3);f();});}
function slide(dx,dy,u,f){if(u<=0)return;save(()=>{const k=eo(u);X.translate(dx*(1-k),dy*(1-k));X.globalAlpha*=clamp(u*2.5);f();});}
// Title with highlighter bar
function title(s,x,y,u,o={}){if(u<=0)return;const size=o.size||84;X.font=`${size}px Anton`;const w=X.measureText(s).width;
  save(()=>{X.globalAlpha*=clamp(u*3);const k=eo(u);
    X.fillStyle=o.bar||GOLD;X.beginPath();X.rect(x-w/2-22,y-size*.42,(w+44)*k,size*.95);X.fill();
    X.save();X.beginPath();X.rect(x-w/2-30,y-size,(w+60)*clamp(u*1.4),size*2);X.clip();
    txt(s,x,y+4,{font:'Anton',w:'',size,color:o.color||INK});X.restore();});}
function chip(s,x,y,u,bg=INK,fg=PAPER,size=40){pop(x,y,u,()=>{X.font=`800 ${size}px Inter`;const w=X.measureText(s).width+size*1.2;rr(-w/2,-size*.8,w,size*1.6,size*.8);X.fillStyle=bg;X.fill();txt(s,0,2,{size,w:800,color:fg});});}

// ---------- stick figure ----------
function pose(name,t){
  const S=Math.sin;let p={aL:[.28,.12],aR:[.28,.12],lL:[.13,0],lR:[.13,0],bob:S(t*3)*1.5,lean:0};
  switch(name){
    case 'wave':p.aR=[2.5+.25*S(t*9),.5];break;
    case 'cheer':{const j=Math.abs(S(t*7));p.aL=[2.6+.2*S(t*7),.3];p.aR=[2.6+.2*S(t*7+1),.3];p.bob=-j*14;break;}
    case 'walk':{const w=S(t*8);p.lL=[.45*w,.25*Math.max(0,-w)];p.lR=[-.45*w,.25*Math.max(0,w)];p.aL=[-.4*w+.15,.2];p.aR=[.4*w+.15,.2];p.bob=-Math.abs(w)*5;break;}
    case 'point':p.aR=[1.55,.05];break;
    case 'stop':p.aR=[1.5,-1.45];p.lean=-.04;break;
    case 'push':p.aL=[1.3,.25];p.aR=[1.3,.25];p.lean=.18;p.lL=[.35,0];p.lR=[-.3,.1];break;
    case 'think':p.aR=[.55,2.55];p.aL=[.45,1.7];break;
    case 'shrug':p.aL=[1.0,-1.5];p.aR=[1.0,-1.5];break;
    case 'sign':p.aR=[2.95,0];p.aL=[2.75,.15];break;
    case 'thumb':p.aR=[1.1,1.4];break;
    case 'arms':p.aL=[1.0,1.9];p.aR=[1.0,1.9];break;
    case 'sad':p.aL=[.12,0];p.aR=[.12,0];p.lean=.12;break;
    case 'tug':p.aL=[1.45,.1];p.aR=[1.45,-.05];p.lean=-.28;p.lL=[-.25,.2];p.lR=[.35,0];break;
    case 'run':{const w=S(t*13);p.lL=[.8*w,.5];p.lR=[-.8*w,.5];p.aL=[-.8*w,1.2];p.aR=[.8*w,1.2];p.lean=.2;p.bob=-Math.abs(w)*10;break;}
  }return p;}
// o: {pose,t,color,s,flip,trump,label,hairless,sign,signColor}
function stick(x,y,o={}){
  const s=o.s||1,C=o.color||INK,t=o.t||0,p=pose(o.pose||'stand',t+(o.ph||0));
  const tr=o.trump;
  save(()=>{
    X.translate(x,y+p.bob*s);X.scale(s*(o.flip?-1:1),s);X.rotate(p.lean);
    const lim=tr?NAVY:C,lw=9;
    const hip=[0,-80],sh=[0,-142],neck=[0,-152];
    const limb=(o0,a,l1,l2,side)=>{const e=[o0[0]+side*l1*Math.sin(a[0]),o0[1]+l1*Math.cos(a[0])];
      const h=[e[0]+side*l2*Math.sin(a[0]+a[1]),e[1]+l2*Math.cos(a[0]+a[1])];line([o0,e,h],lim,lw);return h;};
    limb(hip,p.lL,42,42,-1);limb(hip,p.lR,42,42,1);
    if(tr){ // suit torso
      X.fillStyle=NAVY;X.beginPath();X.moveTo(-24,-150);X.lineTo(24,-150);X.lineTo(19,-74);X.lineTo(-19,-74);X.closePath();X.fill();
      X.fillStyle='#fff';X.beginPath();X.moveTo(-9,-150);X.lineTo(9,-150);X.lineTo(0,-134);X.fill();
      X.fillStyle=RED;X.beginPath();X.moveTo(-4,-146);X.lineTo(4,-146);X.lineTo(7,-100);X.lineTo(0,-92);X.lineTo(-7,-100);X.closePath();X.fill();
    } else line([neck,hip],C,lw);
    const hL=limb(sh,p.aL,36,34,-1),hR=limb(sh,p.aR,36,34,1);
    if(o.pose==='stop')circ(hR[0],hR[1]-4,9,lim);
    if(o.pose==='thumb'){line([[hR[0],hR[1]],[hR[0],hR[1]-16]],lim,8);}
    // head (faceless)
    circ(0,-181,25,tr?SKIN:C);
    if(tr){X.fillStyle=HAIR;X.beginPath();X.moveTo(-27,-184);X.quadraticCurveTo(-30,-214,2,-211);X.quadraticCurveTo(30,-210,33,-190);X.quadraticCurveTo(14,-200,-4,-195);X.quadraticCurveTo(-18,-192,-27,-184);X.fill();}
    if(o.hat){X.fillStyle=o.hat;rr(-28,-208,56,12,4);X.fill();rr(-20,-226,40,22,6);X.fill();}
    o._hand=hR;
  });
  // sign (unflipped)
  if(o.sign){const sx=x+(o.flip?-1:1)*s*(o.pose==='sign'?6:0),sy=y-(o.pose==='sign'?300:0)*s;
    if(o.pose==='sign'){line([[x+(o.flip?-1:1)*s*8,y-210*s],[sx,sy+40*s]],'#7A5A3A',7*s);}
    X.font=`800 ${34*s}px Inter`;const w=Math.max(150*s,X.measureText(o.sign).width+40*s);
    rr(sx-w/2,sy-40*s,w,74*s,10*s);X.fillStyle=o.signColor||'#fff';X.fill();X.lineWidth=5*s;X.strokeStyle=INK;X.stroke();
    txt(o.sign,sx,sy-2*s,{size:34*s,w:800,color:o.signText||INK});}
  if(o.label){const ly=y-(tr?262:250)*s+p.bob*s;X.font=`900 ${30*s}px Inter`;const w=X.measureText(o.label).width+30*s;
    rr(x-w/2,ly-24*s,w,46*s,23*s);X.fillStyle=o.labelBg||(tr?RED:INK);X.fill();txt(o.label,x,ly,{size:30*s,w:900,color:'#fff'});
    X.fillStyle=o.labelBg||(tr?RED:INK);X.beginPath();X.moveTo(x-9*s,ly+21*s);X.lineTo(x+9*s,ly+21*s);X.lineTo(x,ly+33*s);X.fill();}
}
const trump=(x,y,o={})=>stick(x,y,Object.assign({trump:1,label:'TRUMP'},o));

// ---------- props ----------
function capitol(x,y,s,fill='#fff',u=1){save(()=>{X.translate(x,y);X.scale(s*eo(u),s*eo(u));X.globalAlpha*=clamp(u*3);
  X.lineWidth=6;X.strokeStyle=INK;X.fillStyle=fill;
  rr(-230,-70,460,70,4);X.fill();X.stroke();
  for(let i=-200;i<=200;i+=40){line([[i,-62],[i,-6]],INK,5);}
  rr(-120,-120,240,50,4);X.fill();X.stroke();
  X.beginPath();X.moveTo(-90,-120);X.lineTo(-90,-150);X.lineTo(90,-150);X.lineTo(90,-120);X.fill();X.stroke();
  X.beginPath();X.arc(0,-150,82,Math.PI,0);X.closePath();X.fill();X.stroke();
  for(let a=-60;a<=60;a+=30){line([[a*.95,-150],[a*.95,-150-Math.sqrt(Math.max(0,82*82-a*a))*.9]],INK,3);}
  rr(-10,-262,20,32,4);X.fill();X.stroke();line([[0,-262],[0,-300]],INK,4);
  X.fillStyle=RED;X.fillRect(2,-300,30,18);X.fillStyle=BLUE;X.fillRect(2,-300,12,9);});}
function whiteHouse(x,y,s,u=1){save(()=>{X.translate(x,y);X.scale(s*eo(u),s*eo(u));X.globalAlpha*=clamp(u*3);X.lineWidth=6;X.strokeStyle=INK;X.fillStyle='#fff';
  rr(-220,-120,440,120,4);X.fill();X.stroke();
  X.beginPath();X.moveTo(-80,-120);X.lineTo(0,-175);X.lineTo(80,-120);X.closePath();X.fill();X.stroke();
  for(let i=-60;i<=60;i+=30)line([[i,-115],[i,-6]],INK,5);
  for(const sx of[-1,1])for(let i=0;i<3;i++){rr(sx*(110+i*36)-12,-90,24,30,3);X.stroke();rr(sx*(110+i*36)-12,-45,24,30,3);X.stroke();}
  line([[0,-175],[0,-215]],INK,4);X.fillStyle=RED;X.fillRect(2,-215,28,16);X.fillStyle=BLUE;X.fillRect(2,-215,11,8);});}
function hemicycle(cx,cy,R,rows,n,col,u=1,dot=11){const seats=[];
  for(let r=0;r<rows;r++){const rad=R*(.5+.5*r/(rows-1));const k=Math.round(n*rad/(R*.75*rows)*.75);seats.push(...Array.from({length:k},(_,i)=>({r:rad,a:Math.PI-(i+.5)/k*Math.PI})));}
  // fix count
  while(seats.length>n)seats.splice(Math.floor(seats.length*Math.random()),1);
  seats.sort((a,b)=>b.a-a.a);
  return seats;}
const _hemi={};
function drawHemi(key,cx,cy,R,rows,n,col,u,dot){if(!_hemi[key]){let s=[];let tot=0;const radii=[];for(let r=0;r<rows;r++)radii.push(R*(.45+.55*r/(rows-1)));const sum=radii.reduce((a,b)=>a+b);
    radii.forEach((rad,ri)=>{const k=ri<rows-1?Math.round(n*rad/sum):n-tot;tot+=k;for(let i=0;i<k;i++)s.push({r:rad,a:Math.PI-(i+.5)/k*Math.PI});});
    s.sort((a,b)=>b.a-a.a||a.r-b.r);_hemi[key]=s;}
  _hemi[key].forEach((p,i)=>{const v=clamp(u*n*1.3/n*1.0- i/n*0.3);const k=clamp((u*1.6)-(i/n)*0.6);if(k<=0)return;circ(cx+Math.cos(p.a)*p.r,cy-Math.sin(p.a)*p.r,dot*back(k),col(i));});}
function calendar(x,y,s,u,top='NOV',num='3'){pop(x,y,u,()=>{X.scale(s,s);rr(-110,-120,220,240,20);X.fillStyle='#fff';X.fill();X.lineWidth=7;X.strokeStyle=INK;X.stroke();
  rr(-110,-120,220,70,{upperLeft:20,upperRight:20});X.fillStyle=RED;X.fill();X.stroke();txt(top,0,-84,{size:44,color:'#fff'});txt(num,0,30,{font:'Anton',w:'',size:130});
  for(const sx of[-55,55]){rr(sx-8,-140,16,40,8);X.fillStyle=INK;X.fill();}});}
function ballotBox(x,y,s,u){pop(x,y,u,()=>{X.scale(s,s);X.lineWidth=7;X.strokeStyle=INK;X.fillStyle='#fff';
  X.beginPath();X.moveTo(-110,-60);X.lineTo(110,-60);X.lineTo(90,90);X.lineTo(-90,90);X.closePath();X.fill();X.stroke();
  rr(-60,-66,120,12,6);X.fillStyle=INK;X.fill();txt('VOTE',0,15,{font:'Anton',w:'',size:56,color:BLUE});});}
function paper(x,y,s,rot,u,f){pop(x,y,u,()=>{X.rotate(rot);X.scale(s,s);rr(-80,-100,160,200,8);X.fillStyle='#fff';X.fill();X.lineWidth=6;X.strokeStyle=INK;X.stroke();if(f)f();});}
function check(x,y,s,u,c=GREEN){if(u<=0)return;save(()=>{X.translate(x,y);X.scale(s,s);const pts=[[-30,0],[-8,24],[34,-26]];X.strokeStyle=c;X.lineWidth=14;X.lineCap='round';X.lineJoin='round';
  X.setLineDash([120]);X.lineDashOffset=120*(1-eo(u));X.beginPath();pts.forEach((p,i)=>i?X.lineTo(...p):X.moveTo(...p));X.stroke();});}
function cross(x,y,s,u,c=RED){if(u<=0)return;save(()=>{X.translate(x,y);X.scale(s,s);X.strokeStyle=c;X.lineWidth=14;X.lineCap='round';const a=eo(u*2),b=eo(u*2-1);
  X.beginPath();X.moveTo(-30,-30);X.lineTo(-30+60*a,-30+60*a);X.stroke();if(b>0){X.beginPath();X.moveTo(30,-30);X.lineTo(30-60*b,-30+60*b);X.stroke();}});}
function scroll(x,y,s,label,u,c='#FFF7DC'){pop(x,y,u,()=>{X.scale(s,s);rr(-90,-60,180,120,10);X.fillStyle=c;X.fill();X.lineWidth=6;X.strokeStyle=INK;X.stroke();
  for(const sy of[-60,60]){rr(-100,sy-10,200,20,10);X.fillStyle='#E8D9A8';X.fill();X.stroke();}
  txt(label,0,-12,{size:34,w:900});for(let i=0;i<3;i++)line([[-60,16+i*12],[60-i*20,16+i*12]],GREY,4);});}
function magnifier(x,y,s,u){pop(x,y,u,()=>{X.scale(s,s);circ(0,0,46,'rgba(255,255,255,.7)',INK,10);line([[32,32],[80,80]],INK,16);});}
function bolt(x,y,s,u){pop(x,y,u,()=>{X.scale(s,s);X.fillStyle=GOLD;X.strokeStyle=INK;X.lineWidth=5;X.beginPath();
  [[10,-70],[-30,8],[0,8],[-12,70],[34,-12],[4,-12],[22,-70]].forEach((p,i)=>i?X.lineTo(...p):X.moveTo(...p));X.closePath();X.fill();X.stroke();});}
function thermometer(x,y,s,lvl,u){pop(x,y,u,()=>{X.scale(s,s);rr(-26,-220,52,240,26);X.fillStyle='#fff';X.fill();X.lineWidth=7;X.strokeStyle=INK;X.stroke();
  circ(0,40,46,RED,INK,7);rr(-13,20-200*lvl,26,200*lvl+20,13);X.fillStyle=RED;X.fill();
  for(let i=0;i<6;i++)line([[26,-190+i*34],[44,-190+i*34]],INK,4);});}
function cart(x,y,s,u){pop(x,y,u,()=>{X.scale(s,s);line([[-120,-90],[-90,-90],[-60,30],[90,30],[110,-60],[-75,-60]],INK,9);
  circ(-45,62,16,INK);circ(75,62,16,INK);
  rr(-55,-120,50,60,6);X.fillStyle=GOLD;X.fill();X.lineWidth=5;X.stroke();rr(5,-140,40,80,6);X.fillStyle=RED;X.fill();X.stroke();rr(52,-110,42,50,6);X.fillStyle=BLUE;X.fill();X.stroke();});}
function tag(x,y,s,label,u,c=GOLD){pop(x,y,u,()=>{X.scale(s,s);X.fillStyle=c;X.strokeStyle=INK;X.lineWidth=5;X.beginPath();X.moveTo(-70,-34);X.lineTo(50,-34);X.lineTo(80,0);X.lineTo(50,34);X.lineTo(-70,34);X.closePath();X.fill();X.stroke();
  circ(44,0,7,'#fff',INK,3);txt(label,-12,2,{size:36,w:900});},.2);}
function arrowUp(x,y,s,u,c=RED){if(u<=0)return;save(()=>{X.translate(x,y);X.scale(s,s);const h=160*eo(u);line([[0,0],[0,-h]],c,16);X.fillStyle=c;X.beginPath();X.moveTo(-30,-h+10);X.lineTo(30,-h+10);X.lineTo(0,-h-34);X.fill();});}
function gavel(x,y,s,u,swing=0){pop(x,y,u,()=>{X.scale(s,s);X.rotate(-.5+swing);rr(-8,-10,16,120,6);X.fillStyle='#8A5A35';X.fill();X.lineWidth=5;X.strokeStyle=INK;X.stroke();
  rr(-55,-40,110,46,10);X.fillStyle='#A06A3E';X.fill();X.stroke();});}
function scaleBal(x,y,s,tilt,u,lL,lR){pop(x,y,u,()=>{X.scale(s,s);line([[0,0],[0,-220]],INK,10);rr(-70,-10,140,20,8);X.fillStyle=INK;X.fill();
  save(()=>{X.translate(0,-210);X.rotate(tilt);line([[-200,0],[200,0]],INK,9);
    for(const [sx,lab] of[[-1,lL],[1,lR]]){save(()=>{X.translate(sx*190,0);X.rotate(-tilt);line([[-50,90],[0,0],[50,90]],INK,4);X.fillStyle='#fff';X.beginPath();X.ellipse(0,92,70,18,0,0,7);X.fill();X.lineWidth=6;X.stroke();if(lab)lab(0,60);});}
  });circ(0,-210,14,GOLD,INK,5);});}
function flagCO(x,y,s,u){pop(x,y,u,()=>{X.scale(s,s);const w=240,h=160;line([[-w/2-10,-h/2],[-w/2-10,h+60]],INK,8);
  const wv=(i)=>Math.sin(T*4+i)*6;X.fillStyle='#FCD116';X.fillRect(-w/2,-h/2,w,h/2);X.fillStyle='#003893';X.fillRect(-w/2,0,w,h/4);X.fillStyle='#CE1126';X.fillRect(-w/2,h/4,w,h/4);X.lineWidth=5;X.strokeStyle=INK;X.strokeRect(-w/2,-h/2,w,h);});}
function flagUS(x,y,w,h,a=1){save(()=>{X.globalAlpha*=a;for(let i=0;i<13;i++){X.fillStyle=i%2?'#fff':RED;X.fillRect(x,y+i*h/13,w,h/13+1);}X.fillStyle=BLUE;X.fillRect(x,y,w*.4,h*7/13);
  X.fillStyle='#fff';for(let r=0;r<5;r++)for(let c=0;c<6;c++)circ(x+w*.4*(c+.5+(r%2)*.25)/6.3,y+h*7/13*(r+.6)/5.2,4,'#fff');});}
function bar2(x,y,w,h,a,b,ca,cb,u,la,lb){const k=eo(u);rr(x,y,w,h,h/2);X.fillStyle='#E2DDD2';X.fill();
  save(()=>{rr(x,y,w,h,h/2);X.clip();X.fillStyle=ca;X.fillRect(x,y,w*a/(a+b)*k,h);X.fillStyle=cb;X.fillRect(x+w-w*b/(a+b)*k,y,w*b/(a+b)*k,h);});
  if(u>.6){txt(la,x+30,y+h/2+2,{size:h*.55,color:'#fff',align:'left'});txt(lb,x+w-30,y+h/2+2,{size:h*.55,color:'#fff',align:'right'});}}
function bubble(x,y,s,u,draw,flip){pop(x,y,u,()=>{X.scale(s*(flip?-1:1),s);rr(-110,-80,220,140,40);X.fillStyle='#fff';X.fill();X.lineWidth=6;X.strokeStyle=INK;X.stroke();
  X.beginPath();X.moveTo(-40,58);X.lineTo(-70,100);X.lineTo(-10,58);X.fillStyle='#fff';X.fill();X.stroke();X.fillRect(-42,52,34,10);
  X.scale(flip?-1:1,1);draw();});}
function icon(kind,x,y,s,u,c=INK){pop(x,y,u,()=>{X.scale(s,s);circ(0,0,80,'#fff',INK,7);X.lineWidth=9;X.strokeStyle=c;X.fillStyle=c;

const PHOTO=new Image();let photoOK=false;PHOTO.onload=()=>photoOK=true;PHOTO.src='photo.jpg';
const LOGO=new Image();let logoOK=false;LOGO.onload=()=>logoOK=true;LOGO.src='logo.png';
let NEWS=null; // pre-processed newsprint photo
function buildNews(){if(!photoOK||NEWS)return;const w=1200,h=800,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  const ir=PHOTO.width/PHOTO.height;let dw=w,dh=w/ir;if(dh<h){dh=h;dw=h*ir;}
  g.filter='grayscale(1) contrast(1.35) brightness(1.08)';g.drawImage(PHOTO,(w-dw)/2,(h-dh)/2,dw,dh);g.filter='none';
  // halftone: sample luminance, draw dots over a lightened copy
  const src=g.getImageData(0,0,w,h).data;g.fillStyle='#EDE7DA';g.globalAlpha=.55;g.fillRect(0,0,w,h);g.globalAlpha=1;
  const step=7;g.fillStyle='#16140F';
  for(let y=0;y<h;y+=step)for(let x=((y/step)%2)*step/2;x<w;x+=step){const i=((y|0)*w+(x|0))*4;const l=src[i]/255;const r=(1-l)*step*.62;if(r>.3){g.beginPath();g.arc(x,y,r,0,7);g.fill();}}
  // paper grain
  for(let k=0;k<9000;k++){g.fillStyle=`rgba(0,0,0,${Math.random()*.06})`;g.fillRect(Math.random()*w,Math.random()*h,1.5,1.5);}
  NEWS=c;}
// deterministic pseudo-random for torn edges
const prand=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
function newsClip(x,y,w,rot,u,lt,mini){if(u<=0)return;buildNews();const h=mini?w*1.0:w*1.3;save(()=>{const k=back(u);X.translate(x,y);X.rotate(rot);X.scale(k,k);X.globalAlpha*=clamp(u*3);

    for(let i=n;i>=0;i--)X.lineTo(-w/2+w*i/n,h/2+(prand(i+100)-.5)*12);for(let i=n;i>=0;i--)X.lineTo(-w/2+(prand(i+150)-.5)*7,-h/2+h*i/n);X.closePath();};
  save(()=>{X.translate(14,18);path();X.fillStyle='rgba(0,0,0,.22)';X.fill();});
  path();X.fillStyle='#EFEADF';X.fill();X.save();path();X.clip();
  const m=w*.06,iw=w-2*m;let cy=-h/2+m*.9;

  txt('MIÉRCOLES 21 DE OCTUBRE DE 2026   ·   EDICIÓN INTERNACIONAL',0,cy+w*.03,{font:'OldStd',w:'',size:w*.024,color:'#222'});

  if(!mini){txt('Las elecciones del 3 de noviembre definen cuánto poder le queda a Trump',0,cy+w*.02,{font:'OldStd',w:'',size:w*.03,color:'#333'});cy+=w*.055;}
  // photo
  const ph=iw*(mini?.58:.64);X.save();X.beginPath();X.rect(-iw/2,cy,iw,ph);X.clip();
  if(NEWS){const z=1.04+.06*clamp(lt/6);const dw=iw*z,dh=dw*NEWS.height/NEWS.width;X.drawImage(NEWS,-dw/2+iw*.03*clamp(lt/6),cy+ph/2-dh/2,dw,dh);}
  else{X.fillStyle='#CFC8B8';X.fillRect(-iw/2,cy,iw,ph);}
  X.restore();X.strokeStyle='#111';X.lineWidth=1.5;X.strokeRect(-iw/2,cy,iw,ph);cy+=ph+w*.03;
  txt('Donald Trump, presidente de Estados Unidos.',-iw/2,cy,{font:'OldStd',w:'',size:w*.024,color:'#333',align:'left'});cy+=w*.04;
  // body columns
  const cols=3,gap=w*.03,cw=(iw-gap*(cols-1))/cols;X.fillStyle='rgba(20,20,20,.55)';
  for(let c=0;c<cols;c++)for(let r=0;cy+r*w*.026<h/2-m*.4;r++){const lw=cw*(r%7==6?.55:.92+prand(c*31+r)*.08);X.fillRect(-iw/2+c*(cw+gap),cy+r*w*.026,Math.min(lw,cw),w*.009);}
  for(let c=1;c<cols;c++)X.fillRect(-iw/2+c*(cw+gap)-gap/2,cy,1,h/2-cy-m*.4);
  X.restore();});}

const DUR=146.36;let T=0;
function render(t){T=t;background(t);

  save(()=>{const z=1+.025*clamp(lt/d);X.translate(W/2,SC_H/2);X.scale(z,z);X.translate(-W/2,-SC_H/2);
    const tin=clamp(lt/.35);if(tin<1){X.globalAlpha=eo(tin);X.translate(0,(1-eo(tin))*30);}

  const tin=clamp(lt/.3);if(tin<1&&i>0){X.fillStyle=[RED,BLUE,INK,GOLD][i%4];X.fillRect(W*eo(tin),0,W*(1-eo(tin))*.35,H);}
  chrome(t);subtitle(t);}
