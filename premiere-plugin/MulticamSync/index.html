<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Multicam Sync</title>
<style>
  :root { --bg:#232323; --panel:#2d2d2d; --text:#d6d6d6; --muted:#8a8a8a; --accent:#2d8ceb; --line:#3a3a3a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--text); font:12px -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size:13px; margin:0 0 10px; font-weight:600; }
  .step { color:var(--muted); font-size:11px; margin:12px 0 4px; text-transform:uppercase; letter-spacing:.04em; }
  button { width:100%; padding:7px; border:1px solid var(--line); border-radius:4px; background:var(--panel); color:var(--text); cursor:pointer; font-size:12px; }
  button:hover { border-color:#555; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  ul { list-style:none; margin:6px 0 0; padding:0; max-height:140px; overflow:auto; border:1px solid var(--line); border-radius:4px; }
  li { padding:5px 8px; border-bottom:1px solid var(--line); display:flex; gap:6px; align-items:center; }
  li:last-child { border-bottom:0; }
  li label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .empty { color:var(--muted); padding:8px; }
  .row { display:flex; gap:8px; align-items:center; margin-top:6px; }
  .row label { flex:1; }
  input[type=text], input[type=number] { width:100%; padding:5px 6px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; font-size:12px; }
  input[type=number] { width:70px; }
  #log { margin-top:10px; background:#1b1b1b; border:1px solid var(--line); border-radius:4px; padding:6px 8px; height:150px; overflow:auto; white-space:pre-wrap; font:11px Menlo, monospace; color:#b9b9b9; }
  .hint { color:var(--muted); font-size:11px; margin-top:4px; }
</style>
</head>
<body>
  <h1>Multicam Sync · sincronizar por audio</h1>

  <div class="step">1 · Clips de las cámaras</div>
  <button id="load">Usar clips seleccionados en el Proyecto</button>
  <ul id="list"><li class="empty">Selecciona los clips en el panel Proyecto y pulsa el botón.</li></ul>
  <div class="hint">Marca la cámara maestra (la de mejor audio).</div>

  <div class="step">2 · Opciones</div>
  <div class="row"><label for="name">Nombre de la secuencia</label></div>
  <input type="text" id="name" value="MULTICAM">
  <div class="row">
    <label for="shot">Corte automático: segundos por plano (0 = no cortar)</label>
    <input type="number" id="shot" value="0" min="0" step="0.5">
  </div>

  <div class="step">3 · Crear</div>
  <button id="go" class="primary" disabled>Sincronizar y crear secuencia</button>

  <div id="log"></div>

  <script src="js/sync.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
